<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aura 9:16 // Mobile Portrait Showcase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        serif: ['Playfair Display', 'serif']
                    },
                    colors: {
                        aura: {
                            gold: '#F6C177',
                            cyan: '#38BDF8',
                            rose: '#FB7185',
                            violet: '#A78BFA'
                        }
                    },
                    aspectRatio: {
                        '9/16': '9 / 16'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Mobile Ergonomics & Safe Area adjustments */
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }
        
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            padding-top: var(--sat);
            padding-bottom: calc(var(--sab) + 80px);
        }

        /* Glassmorphism */
        .glass-dock {
            background: rgba(13, 16, 26, 0.78);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.6);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Snap scrolling utilities for thumb swiping */
        .snap-y-mandatory {
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .snap-x-mandatory {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .snap-start {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Heart floating particle animation */
        @keyframes heartPop {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            45% { transform: scale(1.3) rotate(0deg); opacity: 1; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 0.9; }
            100% { transform: translateY(-70px) scale(1.5) rotate(15deg); opacity: 0; }
        }
        .animate-heart-pop {
            animation: heartPop 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Lockscreen clock overlay for wallpaper test */
        .clock-font {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            font-weight: 200;
        }
    </style>
</head>
<body class="bg-[#07080D] text-slate-100 min-h-screen w-full select-none overflow-x-hidden flex flex-col font-sans relative">

    <!-- Dynamic Ambient Mood Glow Backdrop -->
    <div id="ambient-glow" class="fixed inset-0 pointer-events-none transition-all duration-700 ease-out z-0">
        <div id="glow-circle-1" class="absolute top-1/4 -left-20 w-80 h-80 rounded-full bg-cyan-500/20 blur-[110px] transition-all duration-700"></div>
        <div id="glow-circle-2" class="absolute bottom-1/4 -right-20 w-80 h-80 rounded-full bg-violet-600/20 blur-[110px] transition-all duration-700"></div>
    </div>

    <!-- Mobile Top Navigation Header -->
    <header class="sticky top-0 z-40 w-full px-5 py-3.5 flex items-center justify-between border-b border-white/5 bg-[#07080D]/70 backdrop-blur-xl">
        <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-400 via-violet-500 to-rose-400 p-[1.5px] shadow-sm">
                <div class="w-full h-full bg-[#07080D] rounded-[6.5px] flex items-center justify-center font-mono font-bold text-xs text-white">
                    9:16
                </div>
            </div>
            <div>
                <h1 class="text-xs font-bold tracking-wider uppercase text-white leading-none">Aura Lens</h1>
                <span id="active-tag" class="text-[10px] font-mono text-cyan-400/90 leading-none">PHOTO 1 OF 4</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Replace image file trigger (phone accessible) -->
            <label for="img-file-input" class="w-9 h-9 rounded-full glass-pill flex items-center justify-center text-slate-300 active:scale-95 transition-all text-xs cursor-pointer" title="Upload / Replace Photo">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </label>
            <input type="file" id="img-file-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

            <!-- Wallpaper Mockup Test Mode Toggle -->
            <button onclick="toggleWallpaperMockup()" id="wallpaper-toggle-btn" class="w-9 h-9 rounded-full glass-pill flex items-center justify-center text-slate-300 active:scale-95 transition-all text-xs" title="Phone Lockscreen Simulation">
                <i class="fa-solid fa-mobile-screen"></i>
            </button>
        </div>
    </header>

    <!-- App Container -->
    <main class="relative z-10 flex-1 w-full max-w-md mx-auto flex flex-col justify-center px-4 py-3">

        <!-- VIEW MODE 1: Stories Snap-Feed (Vertical Reel like TikTok/IG) -->
        <section id="view-stories" class="w-full h-[76vh] max-h-[720px] overflow-y-scroll snap-y-mandatory no-scrollbar rounded-[32px] relative shadow-2xl border border-white/10 bg-black/40">
            <!-- Story Cards injected via JavaScript -->
        </section>

        <!-- VIEW MODE 2: Deck Horizontal Swipe Slider -->
        <section id="view-deck" class="hidden w-full flex flex-col items-center justify-center">
            <div id="deck-slider" class="w-full flex gap-4 overflow-x-scroll snap-x-mandatory no-scrollbar py-2 px-1">
                <!-- Deck Cards injected via JavaScript -->
            </div>
            <!-- Slider Dots -->
            <div id="deck-dots" class="flex items-center justify-center gap-2 mt-4"></div>
        </section>

        <!-- VIEW MODE 3: 2x2 Compact Grid (All 4 on screen at once) -->
        <section id="view-grid" class="hidden w-full grid grid-cols-2 gap-3 py-1">
            <!-- Grid cards injected via JavaScript -->
        </section>

        <!-- Double-tap tip for mobile -->
        <div class="text-center mt-3">
            <p class="text-[11px] font-mono text-slate-500 tracking-tight flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-hand-pointer text-slate-400"></i> Double-tap any photo to like • Tap to enlarge
            </p>
        </div>
    </main>

    <!-- Ergonomic Bottom Floating Action Dock -->
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-[370px] glass-dock rounded-full px-4 py-2.5 flex items-center justify-between text-white">
        <!-- Feed / Stories mode -->
        <button onclick="switchView('stories')" id="tab-stories" class="flex flex-col items-center gap-0.5 px-3 py-1 text-cyan-400 transition-all active:scale-95" title="Vertical Stories">
            <i class="fa-solid fa-film text-base"></i>
            <span class="text-[9px] font-medium tracking-tight">Stories</span>
        </button>

        <!-- Horizontal Deck mode -->
        <button onclick="switchView('deck')" id="tab-deck" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400 hover:text-white transition-all active:scale-95" title="Horizontal Deck">
            <i class="fa-solid fa-layer-group text-base"></i>
            <span class="text-[9px] font-medium tracking-tight">Deck</span>
        </button>

        <!-- 2x2 Grid mode -->
        <button onclick="switchView('grid')" id="tab-grid" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400 hover:text-white transition-all active:scale-95" title="2x2 Overview">
            <i class="fa-solid fa-table-cells-large text-base"></i>
            <span class="text-[9px] font-medium tracking-tight">Grid</span>
        </button>

        <div class="w-[1px] h-6 bg-white/15 my-auto"></div>

        <!-- Heart / Like active button -->
        <button onclick="likeCurrentPhoto()" class="flex flex-col items-center gap-0.5 px-3 py-1 text-rose-400 transition-all active:scale-90" title="Like photo">
            <i class="fa-solid fa-heart text-base animate-pulse"></i>
            <span id="dock-like-count" class="text-[9px] font-mono">1.4k</span>
        </button>
    </nav>

    <!-- Fullscreen Immersive Modal Viewer (with zoom & gestures) -->
    <div id="fs-modal" class="fixed inset-0 z-50 bg-[#05060A]/95 backdrop-blur-2xl hidden opacity-0 transition-opacity duration-300 flex flex-col justify-between p-4">
        <!-- Top bar -->
        <div class="flex items-center justify-between z-20 pt-2">
            <div class="flex items-center gap-2">
                <span id="modal-index-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-mono bg-white/10 text-cyan-300 border border-white/10">01 / 04</span>
                <span id="modal-filename" class="text-xs font-mono text-slate-300">i1.jpg</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="zoomModalImage()" id="modal-zoom-btn" class="w-9 h-9 rounded-full glass-pill flex items-center justify-center text-slate-200" title="Zoom toggle">
                    <i class="fa-solid fa-magnifying-glass-plus text-xs"></i>
                </button>
                <button onclick="shareOrDownloadImage()" class="w-9 h-9 rounded-full glass-pill flex items-center justify-center text-slate-200" title="Save / Share">
                    <i class="fa-solid fa-share-nodes text-xs"></i>
                </button>
                <button onclick="closeFullscreenModal()" class="w-9 h-9 rounded-full bg-white/15 hover:bg-rose-500/20 text-white flex items-center justify-center" title="Close">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <!-- 9:16 Centered display container -->
        <div class="flex-1 flex items-center justify-center overflow-hidden py-2 relative" id="modal-image-container" ondblclick="zoomModalImage()">
            <div class="relative w-auto h-full max-h-[78vh] aspect-9/16 rounded-2xl overflow-hidden shadow-2xl border border-white/15 bg-black transition-transform duration-300" id="modal-img-wrap">
                <img id="modal-img" src="" alt="Fullscreen Portrait" class="w-full h-full object-cover">
                
                <!-- Phone Wallpaper Mockup Overlays (Optional trigger) -->
                <div id="wallpaper-overlay" class="absolute inset-0 pointer-events-none hidden flex-col justify-between p-6">
                    <div class="text-center pt-8 text-white drop-shadow-md">
                        <div class="text-xs font-medium tracking-wide uppercase">Tuesday, November 10</div>
                        <div class="clock-font text-6xl leading-none tracking-tight my-1">09:41</div>
                        <div class="flex items-center justify-center gap-1 text-[11px] font-medium text-white/90">
                            <i class="fa-solid fa-cloud-moon text-xs"></i> 68° Clear
                        </div>
                    </div>
                    <div class="flex items-center justify-between pb-4 px-2">
                        <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white text-sm border border-white/20">
                            <i class="fa-solid fa-flashlight"></i>
                        </div>
                        <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white text-sm border border-white/20">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom modal caption -->
        <div class="w-full max-w-sm mx-auto glass-pill rounded-2xl p-3.5 z-20 flex items-center justify-between gap-3">
            <div class="flex-1">
                <div class="text-[10px] font-mono uppercase tracking-widest text-cyan-400" id="modal-cat">EDITORIAL 9:16</div>
                <h4 class="text-sm font-semibold text-white truncate" id="modal-title">Photo Title</h4>
                <p class="text-[11px] text-slate-300 truncate" id="modal-location">Location Tag</p>
            </div>
            <button onclick="likeCurrentPhoto()" class="px-3.5 py-2 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center gap-1.5 active:scale-95 transition-all text-xs font-semibold">
                <i class="fa-solid fa-heart"></i>
                <span id="modal-like-badge">1.4k</span>
            </button>
        </div>
    </div>

    <!-- Floating Double-Tap Heart Template -->
    <div id="heart-container" class="fixed inset-0 pointer-events-none z-50"></div>

    <!-- Toast message popup -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 glass-pill px-4 py-2 rounded-full text-xs text-white font-medium shadow-2xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300">
        <i class="fa-solid fa-check text-cyan-400 text-xs"></i>
        <span id="toast-text">Notification</span>
    </div>

    <!-- JavaScript logic -->
    <script>
        // 4 Portrait (9:16) Photographs specification with local references & editorial fallbacks
        const photos = [
            {
                id: 1,
                fileName: 'i1.jpg',
                fallbackSrc: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=85&w=1080&h=1920&auto=format&fit=crop',
                title: 'Neon Bloom',
                category: 'Cyberpunk Portrait',
                location: 'Shibuya, Tokyo',
                likes: 1420,
                liked: false,
                color: '#38BDF8', // Cyan
                exif: '9:16 Portrait • 85mm ƒ/1.4'
            },
            {
                id: 2,
                fileName: 'i2.jpg',
                fallbackSrc: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=85&w=1080&h=1920&auto=format&fit=crop',
                title: 'Alpine Mist',
                category: 'Mountain Solitude',
                location: 'Banff, Alberta',
                likes: 2180,
                liked: false,
                color: '#A78BFA', // Violet
                exif: '9:16 Vertical • 24mm ƒ/2.8'
            },
            {
                id: 3,
                fileName: 'i3.jpg',
                fallbackSrc: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?q=85&w=1080&h=1920&auto=format&fit=crop',
                title: 'Golden Hour Silhouette',
                category: 'Cinematic Mood',
                location: 'Amalfi Coast, Italy',
                likes: 3840,
                liked: false,
                color: '#F6C177', // Gold
                exif: '9:16 Portrait • 50mm ƒ/1.8'
            },
            {
                id: 4,
                fileName: 'i4.jpg',
                fallbackSrc: 'https://images.unsplash.com/photo-1513694203232-719a280e022f?q=85&w=1080&h=1920&auto=format&fit=crop',
                title: 'Minimal Void',
                category: 'Modernist Interior',
                location: 'Berlin, Germany',
                likes: 980,
                liked: false,
                color: '#FB7185', // Rose
                exif: '9:16 Architectural • 16mm ƒ/4.0'
            }
        ];

        let activeIndex = 0;
        let currentView = 'stories'; // 'stories' | 'deck' | 'grid'
        let isZoomed = false;
        let wallpaperMockupActive = false;

        // --- Render Views ---

        // 1. Stories View (Snap Vertical Reels)
        function renderStoriesView() {
            const container = document.getElementById('view-stories');
            container.innerHTML = '';

            photos.forEach((photo, index) => {
                const card = document.createElement('div');
                card.className = "w-full h-full snap-start relative flex flex-col justify-between p-5 select-none overflow-hidden";
                card.setAttribute('data-index', index);

                card.innerHTML = `
                    <!-- 9:16 Background Image with Fallback -->
                    <img 
                        src="${photo.fileName}" 
                        onerror="this.onerror=null; this.src='${photo.fallbackSrc}';" 
                        alt="${photo.title}" 
                        class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 pointer-events-none"
                    />

                    <!-- Aesthetic Vignette Gradient -->
                    <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/85 pointer-events-none"></div>

                    <!-- Top Card Status -->
                    <div class="relative z-10 flex items-center justify-between">
                        <div class="glass-pill px-3 py-1 rounded-full text-[10px] font-mono uppercase tracking-wider text-white">
                            ${photo.fileName} • ${photo.exif}
                        </div>
                        <button onclick="openFullscreenModal(${index})" class="w-8 h-8 rounded-full glass-pill flex items-center justify-center text-white active:scale-90 transition-all text-xs">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                    </div>

                    <!-- Bottom Metadata & Touch Action -->
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="w-2 h-2 rounded-full" style="background-color: ${photo.color}"></span>
                            <span class="text-[10px] font-mono tracking-widest uppercase text-slate-300">${photo.category}</span>
                        </div>
                        <h2 class="text-2xl font-serif font-bold text-white leading-tight drop-shadow-md">${photo.title}</h2>
                        <p class="text-xs text-slate-300 font-light mt-0.5 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot text-cyan-400 text-[10px]"></i> ${photo.location}
                        </p>
                    </div>
                `;

                // Double tap gesture for instant heart pop
                let lastTap = 0;
                card.addEventListener('touchend', function (e) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 300 && tapLength > 0) {
                        handleDoubleTapHeart(e, index);
                        e.preventDefault();
                    }
                    lastTap = currentTime;
                });

                // Desktop double click fallback
                card.addEventListener('dblclick', function(e) {
                    handleDoubleTapHeart(e, index);
                });

                container.appendChild(card);
            });

            // Listen to snap scroll events to change active index and background ambient glow
            container.addEventListener('scroll', () => {
                const height = container.clientHeight;
                const newIndex = Math.round(container.scrollTop / height);
                if (newIndex !== activeIndex && newIndex >= 0 && newIndex < photos.length) {
                    setActiveIndex(newIndex);
                }
            });
        }

        // 2. Deck View (Horizontal Snapping Carousel)
        function renderDeckView() {
            const container = document.getElementById('deck-slider');
            const dotsContainer = document.getElementById('deck-dots');
            container.innerHTML = '';
            dotsContainer.innerHTML = '';

            photos.forEach((photo, index) => {
                const card = document.createElement('div');
                card.className = "min-w-[85%] sm:min-w-[78%] h-[68vh] max-h-[600px] snap-start relative rounded-3xl overflow-hidden shadow-2xl border border-white/10 flex flex-col justify-between p-5";
                
                card.innerHTML = `
                    <img 
                        src="${photo.fileName}" 
                        onerror="this.onerror=null; this.src='${photo.fallbackSrc}';" 
                        alt="${photo.title}" 
                        class="absolute inset-0 w-full h-full object-cover pointer-events-none"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30 pointer-events-none"></div>
                    
                    <div class="relative z-10 flex justify-between items-center">
                        <span class="glass-pill px-2.5 py-1 rounded-full text-[10px] font-mono text-white">${photo.fileName}</span>
                        <button onclick="openFullscreenModal(${index})" class="w-8 h-8 rounded-full glass-pill flex items-center justify-center text-white active:scale-90 text-xs">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                    </div>

                    <div class="relative z-10">
                        <span class="text-[9px] font-mono uppercase tracking-widest text-cyan-400">${photo.category}</span>
                        <h3 class="text-xl font-serif font-bold text-white">${photo.title}</h3>
                        <p class="text-xs text-slate-300">${photo.location}</p>
                    </div>
                `;

                // Double tap like gesture
                let lastTap = 0;
                card.addEventListener('touchend', function (e) {
                    const currentTime = new Date().getTime();
                    if (currentTime - lastTap < 300 && currentTime - lastTap > 0) {
                        handleDoubleTapHeart(e, index);
                        e.preventDefault();
                    }
                    lastTap = currentTime;
                });

                container.appendChild(card);

                // Indicator Dot
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all duration-300 ${index === activeIndex ? 'w-6 bg-cyan-400' : 'bg-white/20'}`;
                dot.onclick = () => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
                    setActiveIndex(index);
                };
                dotsContainer.appendChild(dot);
            });

            container.addEventListener('scroll', () => {
                const itemWidth = container.firstElementChild.offsetWidth;
                const newIndex = Math.round(container.scrollLeft / itemWidth);
                if (newIndex !== activeIndex && newIndex >= 0 && newIndex < photos.length) {
                    setActiveIndex(newIndex);
                    updateDeckDots();
                }
            });
        }

        function updateDeckDots() {
            const dots = document.getElementById('deck-dots').children;
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = `w-2 h-2 rounded-full transition-all duration-300 ${i === activeIndex ? 'w-6 bg-cyan-400' : 'bg-white/20'}`;
            }
        }

        // 3. Compact 2x2 Grid View (fits phone viewport)
        function renderGridView() {
            const container = document.getElementById('view-grid');
            container.innerHTML = '';

            photos.forEach((photo, index) => {
                const card = document.createElement('div');
                card.className = "relative aspect-9/16 rounded-2xl overflow-hidden border border-white/10 shadow-lg group cursor-pointer active:scale-95 transition-all";
                card.onclick = () => openFullscreenModal(index);

                card.innerHTML = `
                    <img 
                        src="${photo.fileName}" 
                        onerror="this.onerror=null; this.src='${photo.fallbackSrc}';" 
                        alt="${photo.title}" 
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/20"></div>
                    
                    <div class="absolute top-2 left-2">
                        <span class="px-2 py-0.5 rounded-full text-[9px] font-mono bg-black/60 backdrop-blur-md text-white border border-white/10">${photo.fileName}</span>
                    </div>

                    <div class="absolute bottom-2.5 left-2.5 right-2.5">
                        <h4 class="text-xs font-semibold text-white truncate">${photo.title}</h4>
                        <div class="flex items-center justify-between text-[10px] text-slate-300 mt-0.5">
                            <span class="truncate">${photo.location}</span>
                            <span class="text-rose-400 flex items-center gap-0.5"><i class="fa-solid fa-heart text-[9px]"></i> ${formatNumber(photo.likes)}</span>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Switch View Layout
        function switchView(viewName) {
            currentView = viewName;
            const views = {
                stories: document.getElementById('view-stories'),
                deck: document.getElementById('view-deck'),
                grid: document.getElementById('view-grid')
            };

            const tabs = {
                stories: document.getElementById('tab-stories'),
                deck: document.getElementById('tab-deck'),
                grid: document.getElementById('tab-grid')
            };

            // Toggle visibility
            Object.keys(views).forEach(v => {
                if (v === viewName) {
                    views[v].classList.remove('hidden');
                    tabs[v].classList.remove('text-slate-400');
                    tabs[v].classList.add('text-cyan-400');
                } else {
                    views[v].classList.add('hidden');
                    tabs[v].classList.remove('text-cyan-400');
                    tabs[v].classList.add('text-slate-400');
                }
            });

            if (viewName === 'deck') {
                renderDeckView();
            } else if (viewName === 'grid') {
                renderGridView();
            }

            triggerHapticFeedback();
        }

        // Active State tracking
        function setActiveIndex(index) {
            activeIndex = index;
            const photo = photos[activeIndex];
            document.getElementById('active-tag').innerText = `PHOTO ${photo.id} OF 4`;
            document.getElementById('dock-like-count').innerText = formatNumber(photo.likes);

            // Shift ambient glows to match dominant photo accent
            const glow1 = document.getElementById('glow-circle-1');
            const glow2 = document.getElementById('glow-circle-2');
            glow1.style.backgroundColor = photo.color;
            glow2.style.backgroundColor = photo.color;
        }

        // Double-Tap Floating Heart Animation (Reels/TikTok feeling)
        function handleDoubleTapHeart(e, index) {
            const photo = photos[index];
            if (!photo.liked) {
                photo.liked = true;
                photo.likes++;
                document.getElementById('dock-like-count').innerText = formatNumber(photo.likes);
            }

            // Get position
            const touch = e.touches ? e.touches[0] : e;
            const x = touch ? touch.clientX : window.innerWidth / 2;
            const y = touch ? touch.clientY : window.innerHeight / 2;

            createHeartParticle(x, y);
            triggerHapticFeedback();
        }

        function createHeartParticle(x, y) {
            const heart = document.createElement('div');
            heart.className = "fixed text-rose-500 text-6xl pointer-events-none animate-heart-pop z-50 drop-shadow-lg";
            heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
            heart.style.left = `${x - 30}px`;
            heart.style.top = `${y - 30}px`;

            document.getElementById('heart-container').appendChild(heart);
            setTimeout(() => heart.remove(), 900);
        }

        function likeCurrentPhoto() {
            const photo = photos[activeIndex];
            photo.liked = !photo.liked;
            photo.likes += photo.liked ? 1 : -1;
            document.getElementById('dock-like-count').innerText = formatNumber(photo.likes);
            document.getElementById('modal-like-badge').innerText = formatNumber(photo.likes);
            createHeartParticle(window.innerWidth / 2, window.innerHeight / 2);
            showToast(photo.liked ? `Liked "${photo.title}"` : 'Like removed');
            triggerHapticFeedback();
        }

        // Fullscreen Modal Viewer
        function openFullscreenModal(index) {
            activeIndex = index;
            const photo = photos[index];
            const modal = document.getElementById('fs-modal');
            const img = document.getElementById('modal-img');

            document.getElementById('modal-index-badge').innerText = `0${photo.id} / 04`;
            document.getElementById('modal-filename').innerText = photo.fileName;
            document.getElementById('modal-title').innerText = photo.title;
            document.getElementById('modal-location').innerText = `${photo.location} • ${photo.exif}`;
            document.getElementById('modal-cat').innerText = photo.category;
            document.getElementById('modal-like-badge').innerText = formatNumber(photo.likes);

            img.src = photo.fileName;
            img.onerror = () => { img.onerror = null; img.src = photo.fallbackSrc; };

            isZoomed = false;
            document.getElementById('modal-img-wrap').style.transform = 'scale(1)';

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            triggerHapticFeedback();
        }

        function closeFullscreenModal() {
            const modal = document.getElementById('fs-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function zoomModalImage() {
            isZoomed = !isZoomed;
            const wrap = document.getElementById('modal-img-wrap');
            const zoomBtn = document.getElementById('modal-zoom-btn');
            if (isZoomed) {
                wrap.style.transform = 'scale(1.4)';
                zoomBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass-minus text-xs text-cyan-400"></i>';
            } else {
                wrap.style.transform = 'scale(1)';
                zoomBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass-plus text-xs"></i>';
            }
            triggerHapticFeedback();
        }

        // Wallpaper lockscreen mockup simulation
        function toggleWallpaperMockup() {
            wallpaperMockupActive = !wallpaperMockupActive;
            const overlay = document.getElementById('wallpaper-overlay');
            const btn = document.getElementById('wallpaper-toggle-btn');

            if (wallpaperMockupActive) {
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                btn.classList.add('text-cyan-400', 'bg-white/20');
                // Auto open fullscreen modal if not already open
                const modal = document.getElementById('fs-modal');
                if (modal.classList.contains('hidden')) {
                    openFullscreenModal(activeIndex);
                }
                showToast('Lockscreen Wallpaper Preview Active');
            } else {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                btn.classList.remove('text-cyan-400', 'bg-white/20');
            }
            triggerHapticFeedback();
        }

        // File upload / image replacer for phone
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                // Replace current photo's source
                photos[activeIndex].fileName = event.target.result;
                photos[activeIndex].fallbackSrc = event.target.result;
                photos[activeIndex].title = file.name.substring(0, 16);
                
                // Re-render
                renderStoriesView();
                if (currentView === 'deck') renderDeckView();
                if (currentView === 'grid') renderGridView();
                openFullscreenModal(activeIndex);
                showToast(`Replaced photo ${activeIndex + 1}`);
            };
            reader.readAsDataURL(file);
        }

        function shareOrDownloadImage() {
            const photo = photos[activeIndex];
            if (navigator.share) {
                navigator.share({
                    title: photo.title,
                    text: `Check out this 9:16 portrait: ${photo.title}`,
                    url: window.location.href
                }).catch(() => {});
            } else {
                window.open(photo.fileName, '_blank');
                showToast('Image opened in new tab');
            }
        }

        function formatNumber(num) {
            return num >= 1000 ? (num / 1000).toFixed(1) + 'k' : num;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function triggerHapticFeedback() {
            if (navigator.vibrate) {
                navigator.vibrate(12);
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            renderStoriesView();
            setActiveIndex(0);
        });
    </script>
</body>
</html>
