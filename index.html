<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>9:16 Portrait Gallery</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      background-color: #05070d;
      color: #f1f5f9;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .snap-y-mandatory {
      scroll-snap-type: y mandatory;
    }
    .snap-x-mandatory {
      scroll-snap-type: x mandatory;
    }
    .snap-item {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .glass-dock {
      background: rgba(13, 17, 26, 0.78);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .glass-card {
      background: rgba(22, 27, 39, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .heart-burst {
      animation: heartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      45% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between pb-24">

  <!-- Header -->
  <header class="w-full max-w-md px-5 pt-5 pb-3 flex items-center justify-between sticky top-0 z-30 bg-[#05070d]/80 backdrop-blur-md border-b border-white/5">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center text-xs font-bold shadow-lg shadow-rose-500/20">
        9:16
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-wide text-white/90">Curated Moments</h1>
        <p class="text-[10px] text-zinc-400 font-medium">4 Portrait Captures</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button onclick="toggleLockscreenPreview()" title="Preview Phone Wallpaper" class="w-9 h-9 rounded-full glass-card flex items-center justify-center text-zinc-300 hover:text-white active:scale-95 transition">
        <i class="fa-solid fa-mobile-screen text-xs"></i>
      </button>
      <label for="uploader" title="Replace with Local Photos" class="w-9 h-9 rounded-full glass-card flex items-center justify-center text-zinc-300 hover:text-white cursor-pointer active:scale-95 transition">
        <i class="fa-solid fa-arrow-up-from-bracket text-xs"></i>
      </label>
      <input type="file" id="uploader" accept="image/*" multiple class="hidden" onchange="handleUserUpload(event)">
    </div>
  </header>

  <!-- Ambient Glow Backdrop -->
  <div id="ambient-glow" class="fixed inset-0 pointer-events-none opacity-25 filter blur-[110px] transition-colors duration-1000 -z-10 bg-indigo-900"></div>

  <!-- VIEWPORT CONTAINERS -->
  <main class="w-full max-w-md px-3 pt-2 flex-1 flex flex-col items-center">
    
    <!-- 1. FEED / STORIES VIEW (Vertical Snap) -->
    <div id="view-feed" class="w-full space-y-5 flex flex-col items-center">
      <!-- Injected by JavaScript -->
    </div>

    <!-- 2. DECK / HORIZONTAL SWIPE VIEW -->
    <div id="view-deck" class="hidden w-full flex-col items-center justify-center pt-2">
      <div id="deck-slider" class="w-full flex overflow-x-auto snap-x-mandatory hide-scrollbar space-x-4 px-2 py-4">
        <!-- Injected by JavaScript -->
      </div>
      <div id="deck-indicators" class="flex space-x-2 mt-2">
        <!-- Injected by JavaScript -->
      </div>
    </div>

    <!-- 3. COMPACT 2X2 GRID VIEW -->
    <div id="view-grid" class="hidden w-full grid-cols-2 gap-3 pt-2">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- BOTTOM FLOATING CONTROLLER DOCK -->
  <nav class="fixed bottom-5 z-40 max-w-[340px] w-[90%] glass-dock rounded-full p-1.5 flex items-center justify-around">
    <button onclick="switchView('feed')" id="btn-feed" class="flex items-center space-x-1.5 py-2 px-3.5 rounded-full text-xs font-semibold text-white bg-white/10 transition-all active:scale-95">
      <i class="fa-solid fa-grip-vertical"></i>
      <span>Feed</span>
    </button>
    <button onclick="switchView('deck')" id="btn-deck" class="flex items-center space-x-1.5 py-2 px-3.5 rounded-full text-xs font-semibold text-zinc-400 hover:text-white transition-all active:scale-95">
      <i class="fa-solid fa-table-columns"></i>
      <span>Deck</span>
    </button>
    <button onclick="switchView('grid')" id="btn-grid" class="flex items-center space-x-1.5 py-2 px-3.5 rounded-full text-xs font-semibold text-zinc-400 hover:text-white transition-all active:scale-95">
      <i class="fa-solid fa-border-all"></i>
      <span>Grid</span>
    </button>
  </nav>

  <!-- FULLSCREEN LIGHTBOX MODAL -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl hidden flex-col items-center justify-between p-4 transition-all">
    <div class="w-full flex items-center justify-between z-10 pt-2">
      <button onclick="closeLightbox()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-white active:scale-90 transition">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div id="lightbox-counter" class="text-xs font-semibold uppercase tracking-wider text-white/70 glass-card px-3 py-1.5 rounded-full">
        Photo 1 of 4
      </div>
      <button onclick="shareActivePhoto()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-white active:scale-90 transition">
        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
      </button>
    </div>

    <!-- 9:16 Lightbox Focus Canvas -->
    <div class="relative w-full max-w-sm aspect-[9/16] rounded-3xl overflow-hidden shadow-2xl flex items-center justify-center my-auto border border-white/10">
      <img id="lightbox-img" src="" alt="Zoomed view" class="w-full h-full object-cover">
      <div id="lightbox-heart" class="absolute pointer-events-none hidden text-rose-500 text-7xl drop-shadow-lg top-1/2 left-1/2">
        <i class="fa-solid fa-heart"></i>
      </div>
    </div>

    <div class="w-full max-w-sm pb-2 flex items-center justify-between px-2">
      <div>
        <h4 id="lightbox-title" class="text-sm font-semibold text-white">Title</h4>
        <p id="lightbox-desc" class="text-xs text-zinc-400">Description</p>
      </div>
      <button id="lightbox-like-btn" onclick="toggleActiveLike()" class="w-11 h-11 rounded-full glass-card flex items-center justify-center text-white active:scale-90 transition">
        <i class="fa-regular fa-heart text-lg"></i>
      </button>
    </div>
  </div>

  <!-- PHONE LOCKSCREEN WALLPAPER SIMULATOR MODAL -->
  <div id="lockscreen-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="relative w-full max-w-[320px] aspect-[9/16] rounded-[44px] overflow-hidden border-[6px] border-zinc-700 shadow-2xl flex flex-col justify-between p-6">
      <img id="lockscreen-bg" src="i1.jpeg" class="absolute inset-0 w-full h-full object-cover -z-10" alt="Wallpaper">
      
      <!-- Top Dynamic Island & Time -->
      <div class="flex flex-col items-center pt-2 text-white">
        <div class="w-24 h-4 bg-black rounded-full mb-6"></div>
        <i class="fa-solid fa-lock text-xs opacity-75 mb-1"></i>
        <div id="lock-date" class="text-xs font-medium tracking-wide uppercase opacity-85">Sunday, Nov 9</div>
        <div id="lock-time" class="text-5xl font-light tracking-tight mt-1">09:41</div>
      </div>

      <!-- Bottom Phone Actions -->
      <div class="w-full flex items-center justify-between pb-2 text-white px-2">
        <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-lg flex items-center justify-center border border-white/20">
          <i class="fa-solid fa-flashlight text-sm"></i>
        </div>
        <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-lg flex items-center justify-center border border-white/20">
          <i class="fa-solid fa-camera text-sm"></i>
        </div>
      </div>
    </div>
    <button onclick="toggleLockscreenPreview()" class="absolute top-6 right-6 w-10 h-10 rounded-full glass-card text-white flex items-center justify-center">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <script>
    // Exact requested images with robust 9:16 fallback photos
    const photos = [
      {
        id: 1,
        src: 'i1.jpeg',
        fallback: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1080&auto=format&fit=crop',
        title: 'Golden Radiance',
        subtitle: 'Warm portrait aesthetic',
        glow: 'rgba(234, 88, 12, 0.35)',
        liked: false
      },
      {
        id: 2,
        src: 'i2.jpeg',
        fallback: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1080&auto=format&fit=crop',
        title: 'Urban Serenity',
        subtitle: 'Modern street frames',
        glow: 'rgba(59, 130, 246, 0.35)',
        liked: false
      },
      {
        id: 3,
        src: 'i3.jpeg',
        fallback: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1080&auto=format&fit=crop',
        title: 'Velvet Mood',
        subtitle: 'Subtle neon textures',
        glow: 'rgba(236, 72, 153, 0.35)',
        liked: false
      },
      {
        id: 4,
        src: 'i4.jpeg',
        fallback: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1080&auto=format&fit=crop',
        title: 'Timeless Horizon',
        subtitle: 'Natural ambient focus',
        glow: 'rgba(16, 185, 129, 0.35)',
        liked: false
      }
    ];

    let currentActiveIdx = 0;
    let lastTap = 0;

    function renderFeed() {
      const container = document.getElementById('view-feed');
      container.innerHTML = photos.map((p, idx) => `
        <div class="relative w-full aspect-[9/16] rounded-[28px] overflow-hidden glass-card shadow-2xl group border border-white/10"
             onclick="handleTap(event, ${idx})">
          <img src="${p.src}" onerror="this.onerror=null; this.src='${p.fallback}'" 
               alt="${p.title}" class="w-full h-full object-cover transition duration-500">

          <div class="heart-indicator absolute pointer-events-none hidden text-rose-500 text-6xl drop-shadow-xl top-1/2 left-1/2" id="feed-heart-${idx}">
            <i class="fa-solid fa-heart"></i>
          </div>

          <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/15 to-transparent pointer-events-none"></div>

          <div class="absolute top-4 right-4 glass-card px-2.5 py-1 rounded-full text-[11px] font-semibold text-white/90">
            0${idx + 1}
          </div>

          <div class="absolute bottom-5 left-5 right-5 flex items-end justify-between">
            <div>
              <h3 class="text-base font-bold text-white tracking-wide">${p.title}</h3>
              <p class="text-xs text-zinc-300 font-normal mt-0.5">${p.subtitle}</p>
            </div>
            <button onclick="event.stopPropagation(); toggleLike(${idx})" 
                    class="w-10 h-10 rounded-full glass-card flex items-center justify-center ${p.liked ? 'text-rose-500' : 'text-white'} transition-all active:scale-90">
              <i class="${p.liked ? 'fa-solid' : 'fa-regular'} fa-heart text-base"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderDeck() {
      const slider = document.getElementById('deck-slider');
      const indicators = document.getElementById('deck-indicators');

      slider.innerHTML = photos.map((p, idx) => `
        <div class="snap-item flex-shrink-0 w-[84vw] max-w-[320px] aspect-[9/16] rounded-[32px] overflow-hidden glass-card relative shadow-2xl border border-white/10"
             onclick="openLightbox(${idx})">
          <img src="${p.src}" onerror="this.onerror=null; this.src='${p.fallback}'" alt="${p.title}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-transparent"></div>
          <div class="absolute bottom-5 left-5 right-5 flex justify-between items-end">
            <div>
              <p class="text-[10px] tracking-widest text-indigo-400 font-semibold uppercase">Series #${p.id}</p>
              <h3 class="text-lg font-bold text-white">${p.title}</h3>
            </div>
            <span class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs text-white">
              <i class="fa-solid fa-expand"></i>
            </span>
          </div>
        </div>
      `).join('');

      indicators.innerHTML = photos.map((_, i) => `
        <span class="w-2 h-2 rounded-full transition-all duration-300 ${i === 0 ? 'w-6 bg-white' : 'bg-white/30'}" id="deck-dot-${i}"></span>
      `).join('');

      slider.onscroll = () => {
        const itemWidth = slider.querySelector('.snap-item').offsetWidth;
        const current = Math.round(slider.scrollLeft / itemWidth);
        photos.forEach((_, i) => {
          const dot = document.getElementById(`deck-dot-${i}`);
          if (dot) {
            dot.className = i === current 
              ? 'w-6 h-2 rounded-full bg-white transition-all duration-300' 
              : 'w-2 h-2 rounded-full bg-white/30 transition-all duration-300';
          }
        });
        updateAmbientGlow(current);
      };
    }

    function renderGrid() {
      const grid = document.getElementById('view-grid');
      grid.innerHTML = photos.map((p, idx) => `
        <div class="relative aspect-[9/16] rounded-2xl overflow-hidden glass-card border border-white/10 group cursor-pointer"
             onclick="openLightbox(${idx})">
          <img src="${p.src}" onerror="this.onerror=null; this.src='${p.fallback}'" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-black/30 group-hover:bg-transparent transition"></div>
          <div class="absolute bottom-2.5 left-2.5 right-2.5 text-left">
            <p class="text-xs font-semibold text-white truncate">${p.title}</p>
          </div>
        </div>
      `).join('');
    }

    function switchView(type) {
      const views = ['feed', 'deck', 'grid'];
      views.forEach(v => {
        const el = document.getElementById(`view-${v}`);
        const btn = document.getElementById(`btn-${v}`);
        if (v === type) {
          el.classList.remove('hidden');
          if (v === 'grid') el.classList.add('grid');
          btn.className = 'flex items-center space-x-1.5 py-2 px-3.5 rounded-full text-xs font-semibold text-white bg-white/10 transition-all active:scale-95';
        } else {
          el.classList.add('hidden');
          if (v === 'grid') el.classList.remove('grid');
          btn.className = 'flex items-center space-x-1.5 py-2 px-3.5 rounded-full text-xs font-semibold text-zinc-400 hover:text-white transition-all active:scale-95';
        }
      });
    }

    function handleTap(event, idx) {
      const now = new Date().getTime();
      const timesince = now - lastTap;
      if (timesince < 300 && timesince > 0) {
        triggerHeartBurst(idx);
        photos[idx].liked = true;
        renderFeed();
        if (navigator.vibrate) navigator.vibrate(50);
      } else {
        setTimeout(() => {
          if (new Date().getTime() - lastTap >= 300) {
            openLightbox(idx);
          }
        }, 300);
      }
      lastTap = new Date().getTime();
    }

    function triggerHeartBurst(idx) {
      const heart = document.getElementById(`feed-heart-${idx}`);
      if (!heart) return;
      heart.classList.remove('hidden');
      heart.classList.add('heart-burst');
      setTimeout(() => {
        heart.classList.remove('heart-burst');
        heart.classList.add('hidden');
      }, 800);
    }

    function toggleLike(idx) {
      photos[idx].liked = !photos[idx].liked;
      renderFeed();
    }

    function openLightbox(idx) {
      currentActiveIdx = idx;
      const photo = photos[idx];
      const modal = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const title = document.getElementById('lightbox-title');
      const desc = document.getElementById('lightbox-desc');
      const counter = document.getElementById('lightbox-counter');
      const likeBtn = document.getElementById('lightbox-like-btn');

      img.src = photo.src;
      img.onerror = () => { img.src = photo.fallback; };
      title.innerText = photo.title;
      desc.innerText = photo.subtitle;
      counter.innerText = `Photo ${idx + 1} of 4`;
      likeBtn.className = `w-11 h-11 rounded-full glass-card flex items-center justify-center transition active:scale-90 ${photo.liked ? 'text-rose-500' : 'text-white'}`;
      likeBtn.innerHTML = `<i class="${photo.liked ? 'fa-solid' : 'fa-regular'} fa-heart text-lg"></i>`;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      updateAmbientGlow(idx);
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleActiveLike() {
      const photo = photos[currentActiveIdx];
      photo.liked = !photo.liked;
      openLightbox(currentActiveIdx);
      renderFeed();
    }

    function updateAmbientGlow(idx) {
      const glow = document.getElementById('ambient-glow');
      glow.style.backgroundColor = photos[idx].glow;
    }

    function toggleLockscreenPreview() {
      const modal = document.getElementById('lockscreen-modal');
      const bg = document.getElementById('lockscreen-bg');
      bg.src = photos[currentActiveIdx].src;
      bg.onerror = () => { bg.src = photos[currentActiveIdx].fallback; };

      const now = new Date();
      document.getElementById('lock-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('lock-date').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });

      if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function shareActivePhoto() {
      if (navigator.share) {
        navigator.share({
          title: photos[currentActiveIdx].title,
          text: 'Check out this 9:16 portrait photo',
          url: window.location.href
        }).catch(() => {});
      } else {
        alert('Sharing link copied to clipboard!');
      }
    }

    function handleUserUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      
      Array.from(files).slice(0, 4).forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          photos[index].src = e.target.result;
          renderFeed();
          renderDeck();
          renderGrid();
        };
        reader.readAsDataURL(file);
      });
    }

    // Initial render
    renderFeed();
    renderDeck();
    renderGrid();
  </script>
</body>
</html>
